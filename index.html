<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ẩm Thực Việt Nam</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="hero-section">
      <div class="overlay"></div>
      <div class="content">
        <h1 class="fade-in-down">Ẩm thực Việt Nam</h1>
        <p class="fade-in-up">
          Chào mừng bạn đến với thiên đường ẩm thực Việt Nam – nơi vị giác của
          bạn sẽ được dẫn dắt qua những cung bậc cảm xúc khó quên từ sự thanh
          khiết đến nồng nàn.
        </p>
        <a href="#regions" class="btn-discover fade-in-up">Khám phá ngay</a>
      </div>
    </header>

    <section id="regions" class="regions-container">
      <h2 class="section-title">Chọn Vùng Miền</h2>
      <div class="grid-vung-mien">
        <div class="card mien-bac">
          <div class="card-overlay"></div>
          <h3>Miền Bắc</h3>
        </div>

        <div class="card mien-trung">
          <div class="card-overlay"></div>
          <h3>Miền Trung</h3>
        </div>

        <div class="card mien-nam">
          <div class="card-overlay"></div>
          <h3>Miền Nam</h3>
        </div>

        <div class="card tay-nguyen">
          <div class="card-overlay"></div>
          <h3>Tây Nguyên</h3>
        </div>
      </div>
    </section>
  </body>
</html>
